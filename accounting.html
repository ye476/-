        function confirmManualFocus() {
            const catId = document.getElementById('manualCat').value;
            const itemId = document.getElementById('manualItem').value;
            const startStr = document.getElementById('manualStart').value;
            const endStr = document.getElementById('manualEnd').value;
            if (!itemId) { alert('请选择条目'); return; }
            if (!startStr || !endStr) { alert('请填写开始和结束时间'); return; }
            const start = new Date(startStr);
            const end = new Date(endStr);
            if (end <= start) { alert('结束时间必须晚于开始时间'); return; }
            const duration = Math.floor((end - start) / 1000);
            data.focus.records.push({
                id: generateId(),
                itemId,
                categoryId: catId,
                startTime: start.toISOString(),
                endTime: end.toISOString(),
                duration
            });
            saveData();
            closeModal();
            refreshFocusUI();
        }

        function startTimerForItem(itemId) {
            const item = getFocusItem(itemId);
            if (!item) return;
            const cat = getFocusCategory(item.categoryId);
            timerContext = { itemId, categoryId: item.categoryId };
            document.getElementById('timerLabelText').textContent = `${cat ? cat.name : ''} · ${item.name}`;
            document.getElementById('timerRingFg').style.stroke = cat ? cat.color : 'var(--primary)';
            timerSeconds = 0;
            timerRunning = true;
            document.getElementById('timerDisplay').textContent = '00:00:00';
            document.getElementById('timerPauseBtn').textContent = '⏸ 暂停';
            document.getElementById('timerOverlay').classList.add('show');
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerRunning) {
                    timerSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const h = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${h}:${m}:${s}`;
            const totalSec = 3600;
            const progress = Math.min(timerSeconds / totalSec, 1);
            const circumference = 2 * Math.PI * 95;
            const offset = circumference * (1 - progress);
            document.getElementById('timerRingFg').style.strokeDasharray = circumference;
            document.getElementById('timerRingFg').style.strokeDashoffset = offset;
        }

        function togglePauseTimer() {
            timerRunning = !timerRunning;
            document.getElementById('timerPauseBtn').textContent = timerRunning ? '⏸ 暂停' : '▶ 继续';
        }

        function completeTimer() {
            if (!timerContext) return;
            if (timerInterval) clearInterval(timerInterval);
            timerRunning = false;
            const endTime = new Date();
            const startTime = new Date(endTime - timerSeconds * 1000);
            if (timerSeconds > 0) {
                data.focus.records.push({
                    id: generateId(),
                    itemId: timerContext.itemId,
                    categoryId: timerContext.categoryId,
                    startTime: startTime.toISOString(),
                    endTime: endTime.toISOString(),
                    duration: timerSeconds
                });
                saveData();
            }
            timerContext = null;
            document.getElementById('timerOverlay').classList.remove('show');
            refreshFocusUI();
        }

        document.getElementById('focusPeriodSeg').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('#focusPeriodSeg button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                focusPeriod = e.target.dataset.period;
                if (focusPeriod === 'week') focusViewMode = 'week';
                else focusViewMode = 'heatmap';
                refreshFocusUI();
            }
        });

        function getFocusRecordsInPeriod(period) {
            const now = new Date();
            const records = data.focus.records.filter(r => {
                const d = new Date(r.startTime);
                if (period === 'week') {
                    const ws = getWeekStart(formatDate(now));
                    const we = new Date(ws + 'T00:00:00');
                    we.setDate(we.getDate() + 7);
                    return d >= new Date(ws + 'T00:00:00') && d < we;
                } else if (period === 'month') {
                    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
                } else if (period === 'halfyear') {
                    const sixMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 6, 1);
                    return d >= sixMonthsAgo;
                } else {
                    const yearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
                    return d >= yearAgo;
                }
            });
            return records;
        }

        function renderFocusSummary() {
            const records = getFocusRecordsInPeriod(focusPeriod);
            const catTotals = {};
            const catCounts = {};
            records.forEach(r => {
                const cat = getFocusCategory(r.categoryId);
                const catName = cat ? cat.name : '未知';
                catTotals[catName] = (catTotals[catName] || 0) + (r.duration || 0);
                catCounts[catName] = (catCounts[catName] || 0) + 1;
            });
            let maxDurCat = '-',
                maxCntCat = '-',
                maxStreakCat = '-';
            let maxDur = 0,
                maxCnt = 0;
            Object.entries(catTotals).forEach(([name, dur]) => {
                if (dur > maxDur) { maxDur = dur;
                    maxDurCat = name; }
            });
            Object.entries(catCounts).forEach(([name, cnt]) => {
                if (cnt > maxCnt) { maxCnt = cnt;
                    maxCntCat = name; }
            });
            let maxStreak = 0;
            let bestCat = '-';
            data.focus.categories.forEach(cat => {
                const catDates = [...new Set(records.filter(r => r.categoryId === cat.id).map(r => formatDate(r.startTime)))].sort();
                let streak = 0;
                let best = 0;
                for (let i = 0; i < catDates.length; i++) {
                    if (i === 0) streak = 1;
                    else {
                        const prev = new Date(catDates[i - 1] + 'T00:00:00');
                        const curr = new Date(catDates[i] + 'T00:00:00');
                        const diff = (curr - prev) / (1000 * 3600 * 24);
                        if (diff === 1) streak++;
                        else if (diff > 1) streak = 1;
                    }
                    if (streak > best) best = streak;
                }
                if (best > maxStreak) { maxStreak = best;
                    bestCat = cat.name; }
            });
            maxStreakCat = bestCat;

            document.getElementById('focusSummaryRow').innerHTML = `
                <div class="stat-card sc1"><div class="stat-label">🏆 最久分类</div><div class="stat-value" style="font-size:13px;">${maxDurCat}</div></div>
                <div class="stat-card sc2"><div class="stat-label">🔥 最多分类</div><div class="stat-value" style="font-size:13px;">${maxCntCat}</div></div>
                <div class="stat-card sc3"><div class="stat-label">📅 连续天数</div><div class="stat-value" style="font-size:13px;">${maxStreakCat} ${maxStreak}天</div></div>
            `;
        }

        function drawFocusPieChart() {
            const canvas = document.getElementById('focusPieChart');
            const { ctx, cssWidth, cssHeight } = prepareCanvas(canvas, 1);
            const cx = cssWidth / 2,
                cy = cssHeight / 2,
                r = Math.min(cssWidth, cssHeight) * 0.42,
                innerR = r * 0.55;
            ctx.clearRect(0, 0, cssWidth, cssHeight);
            const records = getFocusRecordsInPeriod(focusPeriod);
            const catTotals = {};
            let total = 0;
            records.forEach(rec => {
                const cat = getFocusCategory(rec.categoryId);
                const name = cat ? cat.name : '未知';
                catTotals[name] = (catTotals[name] || 0) + (rec.duration || 0);
                total += (rec.duration || 0);
            });
            if (total === 0) {
                ctx.fillStyle = '#ccc';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', cx, cy);
                return;
            }
            const catColors = {};
            data.focus.categories.forEach(c => catColors[c.name] = c.color);
            let startAngle = -Math.PI / 2;
            Object.entries(catTotals).forEach(([name, dur]) => {
                const sliceAngle = (dur / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = catColors[name] || '#999';
                ctx.fill();
                startAngle += sliceAngle;
            });
            ctx.beginPath();
            ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.fillStyle = '#3d3d3d';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(formatDurationShort(total), cx, cy - 2);
            ctx.fillStyle = '#888985';
            ctx.font = '10px sans-serif';
            ctx.fillText('总时长', cx, cy + 14);
        }

        function renderFocusWeekGrid() {
            const container = document.getElementById('focusWeekGridContainer');
            if (focusViewMode !== 'week') { container.style.display = 'none'; return; }
            container.style.display = 'block';
            container.innerHTML = '<div class="card-header mt-4"><span class="card-title">📊 周视图时间轴</span></div>';
            const grid = document.createElement('div');
            grid.className = 'week-grid';
            const cells = [];
            for (let row = 0; row < 7; row++) {
                for (let col = 0; col < 24; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'week-cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cells.push({ el: cell, row, col });
                    grid.appendChild(cell);
                }
            }
            container.appendChild(grid);

            const now = new Date();
            const ws = getWeekStart(formatDate(now));
            const weekStartDate = new Date(ws + 'T00:00:00');
            const records = data.focus.records.filter(r => {
                const d = new Date(r.startTime);
                return d >= weekStartDate && d < new Date(weekStartDate.getTime() + 7 * 24 * 3600 * 1000);
            });

            records.forEach(rec => {
                const start = new Date(rec.startTime);
                const end = new Date(rec.endTime);
                const row = getWeekday(start);
                const cat = getFocusCategory(rec.categoryId);
                const color = cat ? cat.color : '#999';
                if (row < 0 || row > 6) return;

                const startHour = start.getHours() + start.getMinutes() / 60;
                const endHour = end.getHours() + end.getMinutes() / 60;

                const startCol = Math.floor(startHour);
                const endCol = Math.floor(endHour);

                if (startCol === endCol) {
                    const dur = endHour - startHour;
                    if (dur >= 1) {
                        setCellFull(cells, row, startCol, color);
                    } else if (dur > 0) {
                        const startMin = start.getMinutes();
                        const endMin = end.getMinutes();
                        if (endMin <= 30) setCellLeftHalf(cells, row, startCol, color);
                        else if (startMin >= 30) setCellRightHalf(cells, row, startCol, color);
                        else if (startMin < 30 && endMin > 30) setCellFull(cells, row, startCol, color);
                        else setCellLeftHalf(cells, row, startCol, color);
                    }
                } else {
                    for (let col = startCol; col <= endCol; col++) {
                        if (col === startCol) {
                            const startMin = start.getMinutes();
                            if (startMin === 0) setCellFull(cells, row, col, color);
                            else setCellRightHalf(cells, row, col, color);
                        } else if (col === endCol) {
                            const endMin = end.getMinutes();
                            if (endMin > 0) setCellLeftHalf(cells, row, col, color);
                            else setCellFull(cells, row, col, color);
                        } else {
                            setCellFull(cells, row, col, color);
                        }
                    }
                }
            });
        }

        function setCellFull(cells, row, col, color) {
            const cell = cells.find(c => c.row === row && c.col === col);
            if (cell) {
                cell.el.style.setProperty('--fill-color', color);
                cell.el.className = 'week-cell filled-full';
                cell.el.style.background = color;
            }
        }

        function setCellRightHalf(cells, row, col, color) {
            const cell = cells.find(c => c.row === row && c.col === col);
            if (cell) {
                cell.el.style.setProperty('--fill-color', color);
                cell.el.className = 'week-cell filled-right';
                cell.el.style.background = `linear-gradient(to right, #f0f0ee 50%, ${color} 50%)`;
            }
        }

        function setCellLeftHalf(cells, row, col, color) {
            const cell = cells.find(c => c.row === row && c.col === col);
            if (cell) {
                cell.el.style.setProperty('--fill-color', color);
                cell.el.className = 'week-cell filled-left';
                cell.el.style.background = `linear-gradient(to left, #f0f0ee 50%, ${color} 50%)`;
            }
        }

        function renderFocusHeatmap() {
            const container = document.getElementById('focusHeatmapContainer');
            if (focusViewMode !== 'heatmap') { container.style.display = 'none'; return; }
            container.style.display = 'block';
            container.innerHTML = '';
            const now = new Date();
            const records = getFocusRecordsInPeriod(focusPeriod);

            if (focusPeriod === 'month') {
                const year = now.getFullYear(),
                    month = now.getMonth();
                const days = getMonthDays(year, month + 1);
                const grid = document.createElement('div');
                grid.className = 'heatmap-grid';
                grid.style.gridTemplateColumns = 'repeat(7,1fr)';
                const dailyTotals = {};
                records.forEach(r => {
                    const d = formatDate(r.startTime);
                    dailyTotals[d] = (dailyTotals[d] || 0) + (r.duration || 0);
                });
                const maxVal = Math.max(...Object.values(dailyTotals), 1);
                const firstDay = new Date(year, month, 1);
                const startWd = getWeekday(firstDay);
                for (let i = 0; i < startWd; i++) {
                    const empty = document.createElement('div');
                    grid.appendChild(empty);
                }
                for (let d = 1; d <= days; d++) {
                    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';
                    const val = dailyTotals[ds] || 0;
                    const intensity = val === 0 ? 0 : Math.max(0.25, val / maxVal);
                    cell.style.background = val === 0 ? '#f0f0ee' : hexToRgba('#8ba889', intensity);
                    cell.textContent = val > 0 ? String(d) : '';
                    cell.style.fontSize = '7px';
                    cell.style.color = val > 0 ? '#fff' : '#ccc';
                    cell.title = `${ds}: ${formatDurationShort(val)}`;
                    grid.appendChild(cell);
                }
                container.innerHTML = '<div class="card-header"><span class="card-title">📅 月视图</span></div>';
                container.appendChild(grid);
            } else if (focusPeriod === 'halfyear') {
                const grid = document.createElement('div');
                grid.className = 'heatmap-grid';
                grid.style.gridTemplateColumns = 'repeat(3,1fr)';
                const monthTotals = {};
                for (let i = 0; i < 6; i++) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const ms = getMonthStr(d);
                    monthTotals[ms] = 0;
                }
                records.forEach(r => {
                    const ms = getMonthStr(r.startTime);
                    if (monthTotals[ms] !== undefined) monthTotals[ms] += (r.duration || 0);
                });
                const maxVal = Math.max(...Object.values(monthTotals), 1);
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const ms = getMonthStr(d);
                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';
                    const val = monthTotals[ms] || 0;
                    const intensity = val === 0 ? 0 : Math.max(0.25, val / maxVal);
                    cell.style.background = val === 0 ? '#f0f0ee' : hexToRgba('#d0a27e', intensity);
                    cell.textContent = `${d.getMonth()+1}月\n${formatDurationShort(val)}`;
                    cell.style.fontSize = '8px';
                    cell.style.whiteSpace = 'pre-line';
                    cell.style.aspectRatio = 'auto';
                    cell.style.minHeight = '50px';
                    grid.appendChild(cell);
                }
                container.innerHTML = '<div class="card-header"><span class="card-title">📊 半年视图</span></div>';
                container.appendChild(grid);
            } else {
                const grid = document.createElement('div');
                grid.className = 'heatmap-grid';
                grid.style.gridTemplateColumns = 'repeat(4,1fr)';
                const monthTotals = {};
                for (let i = 0; i < 12; i++) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const ms = getMonthStr(d);
                    monthTotals[ms] = 0;
                }
                records.forEach(r => {
                    const ms = getMonthStr(r.startTime);
                    if (monthTotals[ms] !== undefined) monthTotals[ms] += (r.duration || 0);
                });
                const maxVal = Math.max(...Object.values(monthTotals), 1);
                for (let i = 11; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const ms = getMonthStr(d);
                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';
                    const val = monthTotals[ms] || 0;
                    const intensity = val === 0 ? 0 : Math.max(0.25, val / maxVal);
                    cell.style.background = val === 0 ? '#f0f0ee' : hexToRgba('#7b9ab6', intensity);
                    cell.textContent = `${d.getMonth()+1}月\n${formatDurationShort(val)}`;
                    cell.style.fontSize = '8px';
                    cell.style.whiteSpace = 'pre-line';
                    cell.style.aspectRatio = 'auto';
                    cell.style.minHeight = '40px';
                    grid.appendChild(cell);
                }
                container.innerHTML = '<div class="card-header"><span class="card-title">📅 年视图</span></div>';
                container.appendChild(grid);
            }
        }

        function openColorPicker(id, type) {
            const colorInput = document.getElementById('hiddenColorPicker');
            pendingColorCallback = { id, type };
            let currentColor = '#000';
            if (type === 'focusCat') {
                const cat = getFocusCategory(id);
                if (cat) currentColor = cat.color;
            } else if (type === 'checkin') {
                const item = data.checkin.items.find(i => i.id === id);
                if (item) currentColor = item.color;
            }
            colorInput.value = currentColor;
            colorInput.click();
        }
        document.getElementById('hiddenColorPicker').addEventListener('input', function() {
            if (pendingColorCallback) {
                const { id, type } = pendingColorCallback;
                if (type === 'focusCat') {
                    const cat = getFocusCategory(id);
                    if (cat) { cat.color = this.value;
                        saveData();
                        refreshFocusUI(); }
                } else if (type === 'checkin') {
                    const item = data.checkin.items.find(i => i.id === id);
                    if (item) { item.color = this.value;
                        saveData();
                        refreshCheckinUI(); }
                }
            }
        });

        function refreshCheckinUI() {
            const container = document.getElementById('checkinContainer');
            container.innerHTML = '';
            data.checkin.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'checkin-card';
                card.style.setProperty('--card-color', item.color || '#8ba889');
                const now = new Date();
                const year = now.getFullYear(),
                    month = now.getMonth();
                let calendarHtml = '';
                if (checkinViewMode === 'month') {
                    const days = getMonthDays(year, month + 1);
                    const firstDay = new Date(year, month, 1);
                    const startWd = getWeekday(firstDay);
                    calendarHtml = '<div class="checkin-calendar">';
                    const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
                    weekDays.forEach(wd => {
                        calendarHtml += `<div style="font-size:8px;color:#bbb;text-align:center;font-weight:600;">${wd}</div>`;
                    });
                    for (let i = 0; i < startWd; i++) calendarHtml += '<div class="cal-day other-month"></div>';
                    const todayStr = formatDate(new Date());
                    for (let d = 1; d <= days; d++) {
                        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const rec = (item.records || []).find(r => r.date === ds);
                        let cls = 'cal-day';
                        if (rec) cls += rec.status === 'success' ? ' success' : ' fail';
                        if (ds === todayStr) cls += ' today';
                        const display = rec && rec.status === 'fail' ? '' : String(d);
                        calendarHtml += `<div class="${cls}" onclick="showCheckinModal('${item.id}','${ds}')" style="${rec && rec.status==='success' ? 'background:'+(item.color||'#8ba889') : ''}">${display}</div>`;
                    }
                    calendarHtml += '</div>';
                } else {
                    calendarHtml = '<div class="checkin-year-grid">';
                    for (let m = 0; m < 12; m++) {
                        const ms = `${year}-${String(m+1).padStart(2,'0')}`;
                        const monthRecs = (item.records || []).filter(r => r.date.startsWith(ms));
                        const successCount = monthRecs.filter(r => r.status === 'success').length;
                        const intensity = successCount > 0 ? Math.min(1, 0.3 + successCount / 30) : 0;
                        calendarHtml += `<div class="checkin-year-cell" style="background:${successCount > 0 ? hexToRgba(item.color || '#8ba889', intensity) : '#f0f0ee'}" onclick="showCheckinMonthDetail('${item.id}','${ms}')">
                            <span class="y-month">${m+1}月</span>
                            <span class="y-count" style="color:${successCount > 0 ? '#fff' : '#999'}">${successCount}次</span>
                        </div>`;
                    }
                    calendarHtml += '</div>';
                }
                card.innerHTML = `
                    <div class="checkin-header">
                        <div class="checkin-name">
                            <span class="color-dot" style="background:${item.color}" onclick="openColorPicker('${item.id}','checkin')"></span>
                            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</span>
                        </div>
                        <div class="checkin-actions">
                            <button class="btn btn-xs btn-outline" onclick="toggleCheckinView()">${checkinViewMode === 'month' ? '📅年' : '📅月'}</button>
                            <button class="btn btn-xs btn-danger" onclick="deleteCheckinItem('${item.id}')">✕</button>
                        </div>
                    </div>
                    ${calendarHtml}
                    <div class="checkin-quick-btns">
                        <button class="btn btn-sm btn-green" onclick="quickCheckin('${item.id}','success')">✅ 打卡成功</button>
                        <button class="btn btn-sm btn-danger" style="background:#f0e7e0;color:#a46a6a;" onclick="quickCheckin('${item.id}','fail')">❌ 打卡失败</button>
                    </div>
                `;
                container.appendChild(card);
            });
            if (data.checkin.items.length === 0) {
                container.innerHTML = '<div class="card text-center text-muted" style="padding:30px;">暂无打卡项，点击上方按钮添加</div>';
            }
        }

        function toggleCheckinView() {
            checkinViewMode = checkinViewMode === 'month' ? 'year' : 'month';
            refreshCheckinUI();
        }

        function showAddCheckinModal() {
            showModal(`
                <h3>➕ 新增打卡项</h3>
                <div class="input-group"><label>打卡内容</label><input class="input-field" id="newCheckinName" placeholder="如：早起"></div>
                <div class="input-group"><label>颜色</label><input class="input-field" id="newCheckinColor" type="color" value="#8ba889"></div>
                <button class="btn btn-primary btn-block" onclick="confirmAddCheckin()">保存</button>
                <button class="btn btn-outline btn-block mt-4" onclick="closeModal()">取消</button>
            `);
        }

        function confirmAddCheckin() {
            const name = document.getElementById('newCheckinName').value.trim();
            if (!name) { alert('请输入打卡内容'); return; }
            const color = document.getElementById('newCheckinColor').value;
            data.checkin.items.push({ id: generateId(), name, color, records: [] });
            saveData();
            closeModal();
            refreshCheckinUI();
        }

        function deleteCheckinItem(id) {
            if (!confirm('确定删除此打卡项？')) return;
            data.checkin.items = data.checkin.items.filter(i => i.id !== id);
            saveData();
            refreshCheckinUI();
        }

        function showCheckinModal(itemId, dateStr) {
            const item = data.checkin.items.find(i => i.id === itemId);
            if (!item) return;
            const existing = (item.records || []).find(r => r.date === dateStr);
            showModal(`
                <h3>${item.name} - ${dateStr}</h3>
                <div class="input-group"><label>打卡结果</label>
                    <select class="input-field" id="checkinStatus">
                        <option value="success" ${existing?.status==='success'?'selected':''}>✅ 成功</option>
                        <option value="fail" ${existing?.status==='fail'?'selected':''}>❌ 失败</option>
                    </select>
                </div>
                <div class="input-group"><label>备注</label>
                    <input class="input-field" id="checkinNote" placeholder="添加备注..." value="${existing?.note || ''}">
                </div>
                <button class="btn btn-primary btn-block" onclick="confirmCheckin('${itemId}','${dateStr}')">保存</button>
                <button class="btn btn-outline btn-block mt-4" onclick="closeModal()">取消</button>
            `);
        }

        function confirmCheckin(itemId, dateStr) {
            const status = document.getElementById('checkinStatus').value;
            const note = document.getElementById('checkinNote').value.trim();
            const item = data.checkin.items.find(i => i.id === itemId);
            if (!item) return;
            if (!item.records) item.records = [];
            const existing = item.records.find(r => r.date === dateStr);
            if (existing) {
                existing.status = status;
                existing.note = note;
            } else {
                item.records.push({ date: dateStr, status, note });
            }
            saveData();
            closeModal();
            refreshCheckinUI();
        }

        function quickCheckin(itemId, status) {
            const item = data.checkin.items.find(i => i.id === itemId);
            if (!item) return;
            const todayStr = formatDate(new Date());
            if (!item.records) item.records = [];
            const existing = item.records.find(r => r.date === todayStr);
            if (existing) {
                existing.status = status;
                existing.note = existing.note || '';
            } else {
                item.records.push({ date: todayStr, status, note: '' });
            }
            saveData();
            refreshCheckinUI();
        }

        function showCheckinMonthDetail(itemId, monthStr) {
            const item = data.checkin.items.find(i => i.id === itemId);
            if (!item) return;
            const monthRecs = (item.records || []).filter(r => r.date.startsWith(monthStr));
            const successCount = monthRecs.filter(r => r.status === 'success').length;
            const failCount = monthRecs.filter(r => r.status === 'fail').length;
            showModal(`
                <h3>${item.name} - ${monthStr}</h3>
                <div style="text-align:center;padding:10px;font-size:15px;">
                    ✅ 成功：${successCount}次<br>❌ 失败：${failCount}次
                </div>
                <button class="btn btn-outline btn-block" onclick="closeModal()">关闭</button>
            `);
        }

        function refreshAll() {
            refreshAccountUI();
            refreshFocusUI();
            refreshCheckinUI();
        }

        function init() {
            refreshAccountUI();
            refreshFocusUI();
            refreshCheckinUI();
            const cats = getAccountCategories(currentType);
            if (cats.length > 0) selectedCatId = cats[0].id;
            renderCatTags();
        }

        init();
    </script>
</body>
</html>
